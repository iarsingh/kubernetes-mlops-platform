# =============================================================================
# Local end-to-end stack: Postgres (MLflow backend) + MinIO (artifact store) +
# MLflow tracking server + the inference API. Bring it up with:
#
#   docker compose up --build -d
#   make train                # or run training against http://localhost:5000
#   curl localhost:8000/health
#
# This lets a reviewer exercise train -> registry -> serve -> /predict with no
# cloud account.
# =============================================================================

name: kubernetes-mlops-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mlflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlflow}
      POSTGRES_DB: ${POSTGRES_DB:-mlflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mlflow}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-shot job that creates the artifact bucket in MinIO.
  minio-setup:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID:-minioadmin} ${AWS_SECRET_ACCESS_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${MLFLOW_ARTIFACT_BUCKET:-mlflow-artifacts} &&
      echo 'bucket ready';
      "
    restart: "no"

  mlflow:
    # Reuse the training image — it already has mlflow, psycopg2, boto3 pinned.
    build:
      context: .
      dockerfile: docker/Dockerfile.training
    entrypoint: ["mlflow"]
    command:
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=postgresql://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD:-mlflow}@postgres:5432/${POSTGRES_DB:-mlflow}
      - --default-artifact-root=s3://${MLFLOW_ARTIFACT_BUCKET:-mlflow-artifacts}/
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  ml-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.inference
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      REGISTERED_MODEL_NAME: churn-classifier
      PRODUCTION_ALIAS: champion
      # Registry-only in the compose stack; a promoted champion must exist.
      ALLOW_LOCAL_FALLBACK: "false"
    ports:
      - "8000:8000"
    depends_on:
      mlflow:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
