name: Deploy to GKE

# Manual, environment-gated deploy. The `production` GitHub Environment should
# have required reviewers configured so this waits for human approval.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (e.g. a commit SHA or vX.Y.Z)"
        required: true
        type: string
      environment:
        description: "Target environment"
        required: true
        default: production
        type: choice
        options:
          - staging
          - production

concurrency:
  # Never run two deploys to the same environment at once.
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # for GCP Workload Identity Federation (keyless auth)

jobs:
  deploy:
    name: helm upgrade --install
    runs-on: ubuntu-latest
    # Gates the job behind the environment's protection rules (approvals).
    environment:
      name: ${{ github.event.inputs.environment }}
    env:
      NAMESPACE: mlops
      RELEASE: ml-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Keyless auth to GCP via Workload Identity Federation (no JSON keys).
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER }}
          location: ${{ secrets.GKE_LOCATION }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Helm upgrade --install
        run: |
          helm upgrade --install "$RELEASE" helm/ml-api \
            --namespace "$NAMESPACE" --create-namespace \
            --set image.repository="${{ secrets.IMAGE_REPOSITORY }}" \
            --set image.tag="${{ github.event.inputs.image_tag }}" \
            --set config.mlflowTrackingUri="${{ secrets.MLFLOW_TRACKING_URI }}" \
            --set existingSecret="ml-api-artifact-store" \
            --set serviceMonitor.enabled=true \
            --wait --timeout 5m --atomic

      - name: Verify rollout
        run: |
          kubectl rollout status "deploy/$RELEASE" -n "$NAMESPACE" --timeout=180s
          kubectl get pods -n "$NAMESPACE" -l app.kubernetes.io/name=ml-api

      # --atomic auto-rolls-back on failure; this makes the outcome explicit.
      - name: Report rollback on failure
        if: failure()
        run: |
          echo "::warning::Deploy failed. Helm --atomic rolled back to the previous release."
          helm history "$RELEASE" -n "$NAMESPACE" || true
