# =============================================================================
# Default values for the ml-api chart.
# Override per-environment with `-f values-prod.yaml` or `--set key=value`.
# =============================================================================

# Number of replicas when autoscaling is disabled. When autoscaling.enabled is
# true, the HPA owns the replica count and this is only the initial value.
replicaCount: 2

image:
  # Container image for the inference service. In CI this is set to the
  # Artifact Registry path, e.g. europe-west1-docker.pkg.dev/PROJECT/mlops/ml-api
  repository: ghcr.io/iarsingh/kubernetes-mlops-platform/ml-api
  # Pin to an immutable tag/digest in production; never rely on :latest.
  tag: ""          # defaults to .Chart.AppVersion when empty
  pullPolicy: IfNotPresent

# Secrets for pulling from a private registry (name(s) of existing secrets).
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Create a dedicated ServiceAccount (least privilege — it needs no API access).
  create: true
  name: ""
  # On GKE, annotate with a Google Service Account for Workload Identity so the
  # pod can reach GCS (MLflow artifacts) / Cloud SQL without static keys.
  annotations: {}
  #   iam.gke.io/gcp-service-account: ml-api@PROJECT.iam.gserviceaccount.com
  automountServiceAccountToken: false

# Pod-level security context (defense in depth; see SECURITY.md).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

# Container-level security context.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80          # service port
  targetPort: 8000  # container port (uvicorn)
  # Prometheus scrape annotations (used when NOT relying on a ServiceMonitor).
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"

# Application configuration surfaced as a ConfigMap and mounted as env vars.
config:
  # MLflow tracking server the pod loads the champion model from.
  mlflowTrackingUri: "http://mlflow.mlflow.svc.cluster.local:5000"
  # Registered model + alias to serve.
  registeredModelName: "churn-classifier"
  productionAlias: "champion"
  logLevel: "INFO"
  # Allow the documented local-file fallback if the registry is unreachable.
  allowLocalFallback: "true"

# Sensitive values (S3/MinIO creds for the artifact store) MUST come from a
# Kubernetes Secret, never from values.yaml. Reference an existing secret here.
# The chart wires these keys in as env vars if the secret name is set.
existingSecret: ""   # e.g. "ml-api-artifact-store"
# Expected keys in that secret: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
# MLFLOW_S3_ENDPOINT_URL

# Resource requests/limits. Requests drive scheduling + the memory HPA target.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

# ---- Probes ---------------------------------------------------------------
# startupProbe protects slow model loads; liveness/readiness split so a model
# that fails to load takes the pod OUT of the Service (503 /ready) without
# killing the process (which /health, liveness, keeps healthy).
startupProbe:
  httpGet:
    path: /health
    port: http
  failureThreshold: 30
  periodSeconds: 5
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# ---- Autoscaling ----------------------------------------------------------
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  # Scale-down stabilization to avoid thrashing under bursty traffic.
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30

# PodDisruptionBudget keeps at least one replica during voluntary disruptions.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# ServiceMonitor for the Prometheus Operator (set false if using scrape annos).
serviceMonitor:
  enabled: false
  interval: 15s
  scrapeTimeout: 10s
  # Namespace/label the Prometheus Operator selects on.
  labels: {}

# Scheduling controls.
nodeSelector: {}
tolerations: []
affinity: {}
# Spread replicas across nodes/zones for resilience.
topologySpreadConstraints: []

# Extra environment variables (list of {name, value} or valueFrom).
extraEnv: []
